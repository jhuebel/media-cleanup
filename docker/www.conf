[www]
user = appuser
group = appuser
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Let workers inherit the container's environment (APP_KEY, DB_DATABASE,
; MEDIA_ROOT, etc.) instead of php-fpm's default of stripping it.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
